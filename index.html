<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracias por tu compra – Offbeat</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      /* Altura completa */
      text-align: center;
    }

    .container {
      max-width: 480px;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .logo {
      width: 140px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .btn-whatsapp {
      display: inline-block;
      padding: 16px 26px;
      background: #25D366;
      color: #000;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(37, 211, 102, 0.7);
      transition: 0.3s;
    }

    .btn-whatsapp:hover {
      box-shadow: 0 0 18px rgba(37, 211, 102, 1);
      transform: scale(1.04);
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>

</head>

<body>

  <div class="container">

    <img src="asdasd.png" alt="Offbeat Logo" class="logo" />

    <h1>¡Gracias por tu compra! 🙌</h1>

    <p>
      Tu pedido está casi listo.
      Enviános tu comprobante de pago presionando el botón de abajo.
      En cuanto lo recibamos, te mandamos la foto de tu guía 📦⚡
    </p>

    <a class="btn-whatsapp"
      href="https://wa.me/50239332737?text=Hola,%20ya%20realicé%20mi%20compra%20en%20Offbeat%20y%20aquí%20adjunto%20mi%20comprobante.%20Gracias.">
      Enviar comprobante por WhatsApp
    </a>

    <div class="footer">Offbeat © Todos los derechos reservados.</div>

  </div>

</body>

</html>
